<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InventarioPro</title>
     <link rel="stylesheet" href="../plantilla/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width:460px">
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            Bienvenido. Ingrese sus credenciales.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="card shadow">
            <div class="card-body p-4">
                <h1 class="text-center h2 mb-1">Acceso</h1>
                <p class="text-center"><span class="badge text-bg-primary">Control de Usuarios</span></p>
                <form class="needs-validation" novalidate>
                    <label for="email" class="form-label">Correo / Usuario</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text">@</span>
                        <input type="text" id="email" class="form-control" placeholder="usuario@dominio.com" required>
                    </div>
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control mb-3" required>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="recordar">
                        <label class="form-check-label" for="recordar">Recordar sesión en este equipo</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar al Panel</button>
                </form>
                <div class="text-center mt-3">
                    <a href="registro.html">Registrar Nueva Cuenta</a> · <a href="#">Olvidé mi contraseña</a><br>
                    <a href="#">Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>

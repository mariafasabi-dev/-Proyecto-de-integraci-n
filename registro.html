<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - InventarioPro</title>
     <link rel="stylesheet" href="../plantilla/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width:640px">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Inicio</a></li>
                <li class="breadcrumb-item"><a href="login.html">Login</a></li>
                <li class="breadcrumb-item active">Registro de Usuario</li>
            </ol>
        </nav>
        <div class="alert alert-info alert-dismissible fade show">
            Complete el formulario para crear un nuevo usuario y acceder al sistema.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="card shadow">
            <div class="card-body p-4">
                <h1 class="text-center h3 mb-1">Crear Nueva Cuenta</h1>
                <p class="text-center"><span class="badge text-bg-success">Nuevo Usuario</span></p>
                <form class="needs-validation" novalidate>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="nombres" class="form-label">Nombres</label>
                            <input type="text" id="nombres" class="form-control" placeholder="Juan" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" id="apellidos" class="form-control" placeholder="Pérez" required>
                        </div>
                    </div>
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text">@</span>
                        <input type="email" id="email" class="form-control" placeholder="usuario@dominio.com" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" class="form-control" minlength="8" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password2" class="form-label">Confirmar Contraseña</label>
                            <input type="password" id="password2" class="form-control" required>
                            <div class="invalid-feedback">Las contraseñas no coinciden.</div>
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="terminos" required>
                        <label class="form-check-label" for="terminos">Acepto los términos y condiciones del sistema</label>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Registrar Cuenta</button>
                </form>
                <hr>
                <p class="text-center mb-0">¿Ya tienes una cuenta? <a href="login.html" class="fw-bold">Iniciar Sesión</a></p>
            </div>
        </div>
    </div>
       <script src="../plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
